  introAnimKind = kind;
  introAnimStart = performance.now();
  cancelAnimationFrame(introAnimId);
  drawIntroFrame(kind, 0.3);
  const loop = (now) => {
    if (!introOpen) return;
    drawIntroFrame(introAnimKind, (now - introAnimStart) / 1000);
    introAnimId = requestAnimationFrame(loop);
  };
  introAnimId = requestAnimationFrame(loop);
}

/* ---------- Input ---------- */
let controlScheme = 'dpad';
let controlChosen = false;   // true once the player picks a scheme themselves

window.addEventListener('keydown', (e) => {
  if (document.getElementById('gameScreen').classList.contains('hidden')) return;
  if (e.key === 'z' || e.key === 'Backspace') { undoMove(); return; }
  if (dead) { if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) restartLevel(); return; }
  if (e.key === 'ArrowUp') tryMove(0,-1);
  if (e.key === 'ArrowDown') tryMove(0,1);
  if (e.key === 'ArrowLeft') tryMove(-1,0);
  if (e.key === 'ArrowRight') tryMove(1,0);
});

// swipe gestures
let swipeStart = null;
const SWIPE_THRESHOLD = 26;

canvas.addEventListener('pointerdown', (e) => {
  if (dead) { restartLevel(); return; }
  if (controlScheme === 'swipe') {
    swipeStart = { x: e.clientX, y: e.clientY };
  } else if (controlScheme === 'tap') {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left - rect.width/2;
    const y = e.clientY - rect.top - rect.height/2;
    if (Math.abs(x) > Math.abs(y)) {
      tryMove(x > 0 ? 1 : -1, 0);
    } else {
      tryMove(0, y > 0 ? 1 : -1);
    }
  }
});
canvas.addEventListener('pointerup', (e) => {
  if (controlScheme !== 'swipe' || !swipeStart) return;
  const dx = e.clientX - swipeStart.x;
  const dy = e.clientY - swipeStart.y;
  swipeStart = null;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_THRESHOLD) return;
  if (Math.abs(dx) > Math.abs(dy)) {
    tryMove(dx > 0 ? 1 : -1, 0);
  } else {
    tryMove(0, dy > 0 ? 1 : -1);
  }
});
canvas.addEventListener('pointercancel', () => { swipeStart = null; });

// mini D-pad
function bindMiniPad(id, dx, dy) {
  document.getElementById(id).addEventListener('pointerdown', (e) => {
    e.preventDefault();
    if (dead) { restartLevel(); return; }
    tryMove(dx, dy);
  });
}
bindMiniPad('mpUp', 0, -1);
bindMiniPad('mpDown', 0, 1);
bindMiniPad('mpLeft', -1, 0);
bindMiniPad('mpRight', 1, 0);

function applyControlScheme() {
  document.getElementById('miniPad').classList.toggle('hidden', controlScheme !== 'dpad');
  const hint = document.getElementById('swipeHint');
  if (controlScheme === 'swipe') { hint.textContent = 'swipe to move'; hint.classList.remove('hidden'); }
  else if (controlScheme === 'tap') { hint.textContent = 'tap a direction to move'; hint.classList.remove('hidden'); }
  else { hint.classList.add('hidden'); }
  document.querySelectorAll('.ctrlOpt').forEach(btn => {
    btn.style.opacity = btn.dataset.scheme === controlScheme ? '1' : '0.5';
    btn.style.borderColor = btn.dataset.scheme === controlScheme ? 'rgba(182,255,61,0.6)' : '';
  });
}

document.getElementById('settingsBtn').addEventListener('click', () => {
  sndClick();
  document.getElementById('settingsPanel').classList.remove('hidden');
  applyControlScheme();
});
document.getElementById('settingsCloseBtn').addEventListener('click', () => {
  sndClick();
  document.getElementById('settingsPanel').classList.add('hidden');
});
document.querySelectorAll('.ctrlOpt').forEach(btn => {
  btn.addEventListener('click', () => {
    sndClick();
    controlScheme = btn.dataset.scheme;
    controlChosen = true;
    saveProgress();
    applyControlScheme();
  });
});
applyControlScheme();

function restartLevel() { loadLevel(curIdx); }

/* ---------- Screens ---------- */
function showScreen(id) {
  ['titleScreen','selectScreen','gameScreen'].forEach(s => {
    document.getElementById(s).classList.toggle('hidden', s !== id);
  });
  if (id === 'gameScreen') spawnT0 = Date.now();   // entrance plays when the board is actually on screen
}

/* ---------- Level select map ---------- */
const mapCanvas = document.getElementById('mapCanvas');
const mapCtx = mapCanvas.getContext('2d');
let mapNodes = [];
const NODE_R = 30;
const ROW_H = 132;
const TOP_PAD = 50;

function computeMapNodes() {
  const wrapW = document.getElementById('mapWrap').clientWidth || 360;
  mapCanvas.width = wrapW;
  const rows = Math.ceil(activeLevels().length / 3);
  mapCanvas.height = TOP_PAD*2 + rows*ROW_H;
  const colX = [wrapW*0.22, wrapW*0.5, wrapW*0.78];
  mapNodes = activeLevels().map((lvl, i) => {
    const row = Math.floor(i/3);
    let colIdx = i % 3;
    if (row % 2 === 1) colIdx = 2 - colIdx; // serpentine
    return { x: colX[colIdx], y: TOP_PAD + row*ROW_H, idx: i };
  });
}

function drawLockIcon(cx, cy, s, color) {
  mapCtx.strokeStyle = color;
  mapCtx.fillStyle = color;
  mapCtx.lineWidth = 2;
  mapCtx.beginPath();
  mapCtx.arc(cx, cy - s*0.35, s*0.55, Math.PI, 0, false);
  mapCtx.stroke();
  mapCtx.fillRect(cx - s*0.75, cy - s*0.15, s*1.5, s*1.15);
}

function drawMap() {
  if (document.getElementById('selectScreen').classList.contains('hidden')) {
    requestAnimationFrame(drawMap);
    return;
  }
  const W = mapCanvas.width, H = mapCanvas.height;
  mapCtx.clearRect(0,0,W,H);

  // connecting lines
  for (let i = 0; i < mapNodes.length - 1; i++) {
    const a = mapNodes[i], b = mapNodes[i+1];
    const segUnlocked = (i+1) < unlocked;
    mapCtx.beginPath();
    mapCtx.moveTo(a.x, a.y);
    const midY = (a.y+b.y)/2;
    mapCtx.bezierCurveTo(a.x, midY, b.x, midY, b.x, b.y);
    if (segUnlocked) {
      mapCtx.strokeStyle = 'rgba(182,255,61,0.55)';
      mapCtx.shadowColor = '#b6ff3d'; mapCtx.shadowBlur = 10;
    } else {
      mapCtx.strokeStyle = 'rgba(255,255,255,0.08)';
      mapCtx.shadowBlur = 0;
    }
    mapCtx.lineWidth = 4;
    mapCtx.stroke();
    mapCtx.shadowBlur = 0;
  }

  // nodes
  const t = Date.now();
  mapNodes.forEach((n, i) => {
    const isUnlocked = i < unlocked;
    const isNext = i === unlocked - 1;
    const s = stars[i] || 0;

    if (isNext) {
      const pulse = 0.5 + Math.sin(t/300)*0.5;
      mapCtx.beginPath();
      mapCtx.arc(n.x, n.y, NODE_R + 6 + pulse*4, 0, Math.PI*2);
      mapCtx.strokeStyle = `rgba(182,255,61,${0.3+pulse*0.4})`;
      mapCtx.lineWidth = 2.5;
      mapCtx.stroke();
    }

    mapCtx.beginPath();
    mapCtx.arc(n.x, n.y, NODE_R, 0, Math.PI*2);
    if (isUnlocked) {
      mapCtx.fillStyle = 'rgba(255,255,255,0.06)';
      mapCtx.shadowColor = '#b6ff3d'; mapCtx.shadowBlur = 14;
      mapCtx.fill();
      mapCtx.shadowBlur = 0;
      mapCtx.strokeStyle = 'rgba(182,255,61,0.5)';
      mapCtx.lineWidth = 2;
      mapCtx.stroke();
    } else {
      mapCtx.fillStyle = 'rgba(255,255,255,0.03)';
      mapCtx.fill();
      mapCtx.strokeStyle = 'rgba(255,255,255,0.1)';
      mapCtx.lineWidth = 1.5;
      mapCtx.stroke();
    }

    mapCtx.fillStyle = isUnlocked ? '#eafff0' : '#4a5262';
    mapCtx.font = "20px 'Bungee', sans-serif";
    mapCtx.textAlign = 'center';
    mapCtx.textBaseline = 'middle';
    if (isUnlocked) {
      mapCtx.fillText(i+1, n.x, n.y - 4);
    } else {
      drawLockIcon(n.x, n.y - 2, 9, '#4a5262');
    }

    if (isUnlocked) {
      mapCtx.font = "11px sans-serif";
      mapCtx.fillStyle = '#ffcf3d';
      mapCtx.shadowColor = 'rgba(255,207,61,0.6)'; mapCtx.shadowBlur = 4;
      mapCtx.fillText('★'.repeat(s) + '☆'.repeat(3-s), n.x, n.y + NODE_R - 6);
      mapCtx.shadowBlur = 0;
    }
  });

  requestAnimationFrame(drawMap);
}

mapCanvas.addEventListener('pointerdown', (e) => {
  const rect = mapCanvas.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;
  for (const n of mapNodes) {
    const d = Math.hypot(x - n.x, y - n.y);
    if (d <= NODE_R && n.idx < unlocked) {
      sndClick();
      loadLevel(n.idx);
      showScreen('gameScreen');
      break;
    }
  }
});

function buildLevelGrid() {
  computeMapNodes();
  document.getElementById('worldTitle').textContent = 'World ' + currentWorld;
  document.getElementById('worldTab1').style.opacity = currentWorld === 1 ? '1' : '0.5';
  document.getElementById('worldTab3').style.opacity = currentWorld === 3 ? '1' : '0.5';
  document.getElementById('worldTab4').style.opacity = currentWorld === 4 ? '1' : '0.5';
}
window.addEventListener('resize', () => { if (mapNodes.length) computeMapNodes(); });
drawMap();

document.getElementById('playBtn').addEventListener('click', () => {
  sndClick();
  buildLevelGrid();
  showScreen('selectScreen');
});
document.getElementById('backBtn').addEventListener('click', () => { sndClick(); showScreen('titleScreen'); });
document.getElementById('menuBtn').addEventListener('click', () => { sndClick(); buildLevelGrid(); showScreen('selectScreen'); });
document.getElementById('worldTab1').addEventListener('click', () => { sndClick(); switchWorld(1); buildLevelGrid(); });
document.getElementById('worldTab3').addEventListener('click', () => { sndClick(); switchWorld(3); buildLevelGrid(); });
document.getElementById('worldTab4').addEventListener('click', () => { sndClick(); switchWorld(4); buildLevelGrid(); });
document.getElementById('nextBtn').addEventListener('click', () => {
  if (pendingComplete) { sndClick(); pendingComplete = false; seenIntros.worldComplete = true; saveProgress(); showWorldComplete(); return; }
  if (curIdx+1 < activeLevels().length) { loadLevel(curIdx+1); }
});
document.getElementById('compSelectBtn').addEventListener('click', () => { sndClick(); document.getElementById('completePanel').classList.add('hidden'); buildLevelGrid(); showScreen('selectScreen'); });
document.getElementById('compBackBtn').addEventListener('click', () => { sndClick(); document.getElementById('completePanel').classList.add('hidden'); });
document.getElementById('winMenuBtn').addEventListener('click', () => { sndClick(); document.getElementById('winPanel').classList.add('hidden'); buildLevelGrid(); showScreen('selectScreen'); });
document.getElementById('retryBtn').addEventListener('click', () => { sndClick(); loadLevel(curIdx); });
document.getElementById('hintBtn').addEventListener('click', () => { sndClick(); showHint(); });
document.getElementById('undoBtn').addEventListener('click', undoMove);

loadProgress();
applyUnlockAll();   // also covers a fresh browser with no save
applyControlScheme();
loadLevel(0);
render();
</script>
